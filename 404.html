permalink: /404.html
---
<!DOCTYPE html>
<html lang="gl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Anxo López Rodríguez</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Lottie Player -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <style>
        :root {
            --bg-body: #F8FAFC;
            --text-title: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
        }
        html.dark {
            --bg-body: #0F172A;
            --text-title: #FFFFFF;
            --text-body: #CBD5E1;
            --text-muted: #94A3B8;
        }
        body { 
            background-color: var(--bg-body); 
            color: var(--text-body); 
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease; 
        }
        .theme-title { color: var(--text-title); }
        .theme-muted { color: var(--text-muted); }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .float-in { animation: floatIn 0.8s ease-out forwards; opacity: 0; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-300 { animation-delay: 0.3s; }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- Encabezado simplificado sin línea -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-50">
        <div class="text-xl font-bold tracking-tight theme-title">
            <a href="/" id="header-logo-link">Anxo López Rodríguez</a>
        </div>
        
        <div class="flex items-center">
            <!-- Selector de idioma -->
            <div class="relative inline-block text-left mr-4 pr-4 border-r border-slate-300 dark:border-slate-700">
                <button id="lang-menu-btn" class="flex items-center gap-1 text-sm font-semibold theme-title hover:opacity-80 focus:outline-none">
                    <i class="fa-solid fa-globe"></i>
                    <span id="current-lang-label">GL</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                <div id="lang-dropdown" class="hidden absolute right-0 mt-2 w-32 rounded-xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 z-50">
                    <div class="py-1">
                        <button onclick="changeLanguage('gl')" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Galego (GL)</button>
                        <button onclick="changeLanguage('es')" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Español (ES)</button>
                        <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">English (EN)</button>
                    </div>
                </div>
            </div>

            <!-- Botón Tema -->
            <button class="theme-title hover:opacity-80 transition-opacity" id="theme-toggle" aria-label="Toggle theme">
                <i class="fa-solid fa-moon text-xl" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow flex items-center justify-center p-6 text-center z-10">
        <div class="max-w-2xl w-full mx-auto -mt-10">
            
            <!-- Animación Lottie del Pingüino -->
            <div class="relative w-64 h-64 md:w-80 md:h-80 mx-auto mb-2 float-in flex justify-center">
                <dotlottie-player src="/assets/pictures/penguin-404.lottie" background="transparent" speed="1" style="width: 100%; height: 100%;" loop autoplay></dotlottie-player>
            </div>

            <!-- Textos -->
            <div class="float-in delay-100">
                <h1 class="text-3xl md:text-5xl font-bold theme-title mb-4" id="error-title"></h1>
                <p class="text-lg md:text-xl theme-muted max-w-xl mx-auto mb-8" id="error-description"></p>
                
                <!-- Botón Volver a Inicio -->
                <a href="/" id="back-home-btn" class="inline-flex items-center gap-2 px-8 py-3 rounded-xl font-bold text-white transition-all hover:-translate-y-1 hover:shadow-lg" style="background-color: #6f7d95;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span id="btn-text"></span>
                </a>
            </div>

            <!-- Cita Aleatoria (Limpia y sin comillas que se corten) -->
            <div id="quote-section" class="hidden float-in delay-300 mt-14 mx-auto max-w-2xl px-4">
                <p class="text-sm md:text-base theme-muted mb-3" id="quote-intro"></p>
                <p class="text-lg md:text-xl italic theme-title font-medium" id="quote-text"></p>
            </div>
        </div>
    </main>

    <!-- Gatito Asomando -->
    <div class="fixed bottom-0 right-4 md:right-10 w-32 h-32 md:w-48 md:h-48 pointer-events-none z-50">
        <dotlottie-player src="/assets/pictures/cat.lottie" background="transparent" speed="1" style="width: 100%; height: 100%;" loop autoplay></dotlottie-player>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Modo Oscuro
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function updateThemeIcon() {
            themeIcon.className = html.classList.contains('dark') ? 'fa-solid fa-sun text-xl text-yellow-400' : 'fa-solid fa-moon text-xl';
        }
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        });

        // 2. Desplegable de Idioma
        const langMenuBtn = document.getElementById('lang-menu-btn');
        const langDropdown = document.getElementById('lang-dropdown');
        
        langMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('hidden');
        });
        
        document.addEventListener('click', () => {
            langDropdown.classList.add('hidden');
        });

        // 3. Textos y Lógica de Idioma
        let language = 'gl'; 
        const urlPath = window.location.pathname;
        
        if (urlPath.includes('/es/')) language = 'es';
        else if (urlPath.includes('/en/')) language = 'en';
        else if (!urlPath.includes('/gl/')) {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang.startsWith('es')) language = 'es';
            else if (browserLang.startsWith('en')) language = 'en';
        }

        const texts = {
            es: {
                title: 'Página no encontrada',
                description: '¡Ups! La página que buscas no existe o ha sido movida a otro lugar.',
                quoteIntro: 'Sin embargo, aqui tienes una frase de',
                backBtn: 'Volver a inicio',
                homeLink: '/es/'
            },
            en: {
                title: 'Page not found',
                description: 'Oops! The page you are looking for does not exist or has been moved.',
                quoteIntro: 'However, here\'s a quote from',
                backBtn: 'Back to home',
                homeLink: '/en/'
            },
            gl: {
                title: 'Páxina non atopada',
                description: 'Ups! A páxina que buscas non existe ou foi movida a outro lugar.',
                quoteIntro: 'Non obstante, aqui tes unha frase de',
                backBtn: 'Volver ao inicio',
                homeLink: '/gl/'
            }
        };

        function updateContent() {
            document.getElementById('html-root').setAttribute('lang', language);
            document.getElementById('current-lang-label').textContent = language.toUpperCase();
            document.getElementById('error-title').textContent = texts[language].title;
            document.getElementById('error-description').textContent = texts[language].description;
            document.getElementById('btn-text').textContent = texts[language].backBtn;
            
            const homeUrl = texts[language].homeLink;
            document.getElementById('back-home-btn').href = homeUrl;
            document.getElementById('header-logo-link').href = homeUrl;

            // Actualizar la intro de la cita si ya hay una cargada
            const quoteIntroEl = document.getElementById('quote-intro');
            if (quoteIntroEl.dataset.autor) {
                quoteIntroEl.textContent = `${texts[language].quoteIntro} ${quoteIntroEl.dataset.autor}:`;
            }
        }

        // Función global para cambiar el idioma desde el menú
        window.changeLanguage = function(lang) {
            language = lang;
            updateContent();
            langDropdown.classList.add('hidden');
        };

        updateContent(); // Inicializar con el idioma detectado

        // 4. Cargar Cita Aleatoria
        fetch('/assets/quotes.json')
            .then(response => response.ok ? response.json() : null)
            .then(quotes => {
                if (quotes && quotes.length > 0) {
                    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                    const quoteIntroEl = document.getElementById('quote-intro');
                    
                    quoteIntroEl.dataset.autor = randomQuote.autor;
                    quoteIntroEl.textContent = `${texts[language].quoteIntro} ${randomQuote.autor}:`;
                    
                    // Añadimos las comillas normales directamente en el texto
                    document.getElementById('quote-text').textContent = `"${randomQuote.frase}"`;
                    document.getElementById('quote-section').classList.remove('hidden');
                }
            }).catch(e => console.log('Error quotes:', e));
    });
    </script>
</body>
</html>
